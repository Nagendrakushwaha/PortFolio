<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="portalGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#8a2be2" />
      <stop offset="100%" stop-color="#02040a" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#040817"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#portalGrad)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="22" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="8 4"/>
  <circle cx="50" cy="50" r="8" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="35" cy="40" r="3" fill="#8a2be2"/>
  <circle cx="65" cy="58" r="2.5" fill="#00f2fe"/>
</svg>