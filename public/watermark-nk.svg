<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 2400" width="100%" height="100%">
  <defs>
    <!-- Ultra-Refined Metallic Silver Gradients -->
    <linearGradient id="silverChromeMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="18%" stop-color="#E2E8F0" stop-opacity="1"/>
      <stop offset="35%" stop-color="#94A3B8" stop-opacity="1"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="68%" stop-color="#CBD5E1" stop-opacity="1"/>
      <stop offset="85%" stop-color="#64748B" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F1F5F9" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="silverHighlightFacet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#E2E8F0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="silverShadowFacet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#64748B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Subtle Electric Blue & Violet Accents -->
    <linearGradient id="electricBlueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="royalVioletAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8A2BE2" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="orbitalRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#E2E8F0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="75%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="luxuryGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="28" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleAura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="castShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="gemGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ========================================== -->
  <!-- 1. BACK ORBITAL RING (Passes behind monogram) -->
  <!-- ========================================== -->
  <g id="back-orbital-ring" transform="rotate(-24 1200 1120)">
    <!-- Faint cosmic guide rail -->
    <ellipse cx="1200" cy="1120" rx="720" ry="210" fill="none" stroke="url(#orbitalRingGrad)" stroke-width="1.5" stroke-dasharray="16 10" opacity="0.35"/>
    
    <!-- Deep arc passing behind -->
    <path d="M 480 1120 A 720 210 0 0 1 1920 1120" fill="none" stroke="url(#royalVioletAccent)" stroke-width="6" opacity="0.6" filter="url(#subtleAura)"/>
    <path d="M 480 1120 A 720 210 0 0 1 1920 1120" fill="none" stroke="url(#silverChromeMain)" stroke-width="3" opacity="0.75"/>
  </g>

  <!-- ========================================== -->
  <!-- 2. ROYAL IMPERIAL CROWN                     -->
  <!-- ========================================== -->
  <g id="royal-crown" filter="url(#castShadow)">
    <!-- Subtle Crown Halo Aura -->
    <ellipse cx="1200" cy="610" rx="360" ry="100" fill="url(#electricBlueAccent)" opacity="0.12" filter="url(#luxuryGlow)"/>

    <!-- Crown Base Arch Band -->
    <path d="M 980 640 Q 1200 665 1420 640 L 1400 668 Q 1200 695 1000 668 Z" fill="url(#crownGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
    <path d="M 985 645 Q 1200 670 1415 645" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>

    <!-- Crown Base Inset Jewels (Sapphire & Amethyst) -->
    <circle cx="1040" cy="656" r="5" fill="#00F2FE" filter="url(#gemGlow)"/>
    <circle cx="1120" cy="662" r="6" fill="#C084FC" filter="url(#gemGlow)"/>
    <circle cx="1200" cy="665" r="7.5" fill="#FFFFFF" filter="url(#gemGlow)"/>
    <circle cx="1280" cy="662" r="6" fill="#00F2FE" filter="url(#gemGlow)"/>
    <circle cx="1360" cy="656" r="5" fill="#C084FC" filter="url(#gemGlow)"/>

    <!-- Crown Spires / Peaks -->
    <!-- Left Outer Fleur / Curve -->
    <path d="M 980 640 C 950 580 940 540 965 520 C 980 508 1005 525 1015 550 C 1025 575 1040 610 1055 645 Z" fill="url(#silverChromeMain)" stroke="#FFFFFF" stroke-width="1"/>
    <circle cx="965" cy="516" r="8" fill="url(#silverChromeMain)" stroke="#00F2FE" stroke-width="1.5" filter="url(#subtleAura)"/>

    <!-- Left Mid Spire -->
    <path d="M 1055 645 L 1100 480 L 1145 650 Z" fill="url(#silverHighlightFacet)"/>
    <path d="M 1100 480 L 1145 650 L 1100 655 Z" fill="url(#silverShadowFacet)"/>
    <circle cx="1100" cy="475" r="9.5" fill="url(#crownGrad)" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="1100" cy="475" r="4" fill="#00F2FE" opacity="0.8"/>

    <!-- Center Majestic Imperial Spire (Tallest) -->
    <path d="M 1145 650 L 1200 405 L 1255 650 Z" fill="url(#silverHighlightFacet)"/>
    <path d="M 1200 405 L 1255 650 L 1200 658 Z" fill="url(#silverShadowFacet)"/>
    
    <!-- Imperial Cross / Star Finial on Center Spire -->
    <g transform="translate(1200 395)">
      <!-- 4-point Diamond Star -->
      <path d="M 0 -22 L 6 -6 L 22 0 L 6 6 L 0 22 L -6 6 L -22 0 L -6 -6 Z" fill="url(#silverChromeMain)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#gemGlow)"/>
      <circle cx="0" cy="0" r="4.5" fill="#00F2FE"/>
    </g>

    <!-- Right Mid Spire -->
    <path d="M 1255 650 L 1300 480 L 1345 645 Z" fill="url(#silverHighlightFacet)"/>
    <path d="M 1300 480 L 1345 645 L 1300 655 Z" fill="url(#silverShadowFacet)"/>
    <circle cx="1300" cy="475" r="9.5" fill="url(#crownGrad)" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="1300" cy="475" r="4" fill="#C084FC" opacity="0.8"/>

    <!-- Right Outer Fleur / Curve -->
    <path d="M 1420 640 C 1450 580 1460 540 1435 520 C 1420 508 1395 525 1385 550 C 1375 575 1360 610 1345 645 Z" fill="url(#silverChromeMain)" stroke="#FFFFFF" stroke-width="1"/>
    <circle cx="1435" cy="516" r="8" fill="url(#silverChromeMain)" stroke="#C084FC" stroke-width="1.5" filter="url(#subtleAura)"/>
  </g>

  <!-- ========================================== -->
  <!-- 3. INTERLOCKING "NK" MONOGRAM              -->
  <!-- ========================================== -->
  <g id="interlocking-monogram" filter="url(#castShadow)">
    
    <!-- Ambient Blue/Violet Edge Underglow -->
    <g opacity="0.4" filter="url(#luxuryGlow)">
      <!-- Soft duplicate of monogram in electric cyan and violet -->
      <path d="M 760 760 L 860 760 L 860 1440 L 760 1440 Z" fill="#00F2FE"/>
      <path d="M 860 800 L 1240 1440 L 1340 1440 L 960 800 Z" fill="#38BDF8"/>
      <path d="M 1240 760 L 1340 760 L 1340 1440 L 1240 1440 Z" fill="#C084FC"/>
      <path d="M 1260 1080 L 1560 760 L 1680 760 L 1340 1140 Z" fill="#8A2BE2"/>
      <path d="M 1320 1100 L 1620 1440 L 1740 1440 L 1400 1060 Z" fill="#C084FC"/>
    </g>

    <!-- LETTER 'N' -->
    <!-- N: Left Vertical Stem with Chiseled Bevel -->
    <g id="n-left-stem">
      <!-- Upper Serif Cap -->
      <polygon points="720,770 880,770 860,820 760,820" fill="url(#silverChromeMain)" stroke="#E2E8F0" stroke-width="1"/>
      <!-- Lower Serif Base -->
      <polygon points="720,1470 880,1470 860,1420 760,1420" fill="url(#silverChromeMain)" stroke="#CBD5E1" stroke-width="1"/>
      
      <!-- Main Stem (Chiseled Vertical) -->
      <!-- Left Facet (Highlight) -->
      <polygon points="760,820 810,820 810,1420 760,1420" fill="url(#silverHighlightFacet)"/>
      <!-- Right Facet (Shadow) -->
      <polygon points="810,820 860,820 860,1420 810,1420" fill="url(#silverShadowFacet)"/>
      <!-- Center Chiseled Crease -->
      <line x1="810" y1="820" x2="810" y2="1420" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9"/>
      <!-- Outer Contour Stroke -->
      <rect x="760" y="820" width="100" height="600" fill="none" stroke="url(#electricBlueAccent)" stroke-width="2"/>
    </g>

    <!-- N: Diagonal Stroke (Slicing across) -->
    <g id="n-diagonal">
      <!-- Left/Top Facet (Brilliant Chrome Highlight) -->
      <polygon points="860,800 890,780 1250,1400 1200,1440" fill="url(#silverHighlightFacet)"/>
      <!-- Right/Bottom Facet (Deep Metallic Shadow) -->
      <polygon points="890,780 940,780 1300,1400 1250,1400" fill="url(#silverShadowFacet)"/>
      <!-- Diagonal Ridge Crease -->
      <line x1="890" y1="780" x2="1250" y2="1400" stroke="#FFFFFF" stroke-width="3" opacity="0.95"/>
    </g>

    <!-- N: Right Vertical Stem (Interlocks with K) -->
    <g id="n-right-stem">
      <!-- Upper Serif Cap -->
      <polygon points="1200,770 1360,770 1340,820 1240,820" fill="url(#silverChromeMain)" stroke="#E2E8F0" stroke-width="1"/>
      <!-- Lower Serif Base -->
      <polygon points="1200,1470 1360,1470 1340,1420 1240,1420" fill="url(#silverChromeMain)" stroke="#CBD5E1" stroke-width="1"/>

      <!-- Right Stem Left Facet -->
      <polygon points="1240,820 1290,820 1290,1420 1240,1420" fill="url(#silverHighlightFacet)"/>
      <!-- Right Stem Right Facet -->
      <polygon points="1290,820 1340,820 1340,1420 1290,1420" fill="url(#silverShadowFacet)"/>
      <!-- Center Ridge -->
      <line x1="1290" y1="820" x2="1290" y2="1420" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9"/>
      <!-- Outer Contour -->
      <rect x="1240" y="820" width="100" height="600" fill="none" stroke="url(#silverChromeMain)" stroke-width="2"/>
    </g>

    <!-- INTERLOCKING JUNCTION: Shadow Cast onto N where K passes through -->
    <ellipse cx="1290" cy="1120" rx="60" ry="70" fill="#000000" opacity="0.55" filter="url(#subtleAura)"/>

    <!-- LETTER 'K' (Interlocking with N right stem) -->
    <!-- K: Upper Diagonal Arm (Swooping to top-right) -->
    <g id="k-upper-arm">
      <!-- Beveled Serif Finial at Top-Right of K -->
      <polygon points="1520,770 1680,770 1660,820 1560,820" fill="url(#silverChromeMain)" stroke="#C084FC" stroke-width="1.5"/>

      <!-- Upper Arm Top Facet -->
      <polygon points="1240,1130 1560,820 1610,820 1300,1110" fill="url(#silverHighlightFacet)"/>
      <!-- Upper Arm Bottom Facet -->
      <polygon points="1300,1110 1610,820 1660,820 1340,1130" fill="url(#silverShadowFacet)"/>
      <!-- Center Chiseled Ridge -->
      <line x1="1270" y1="1120" x2="1610" y2="820" stroke="#FFFFFF" stroke-width="3" opacity="0.95"/>
      <path d="M 1240 1130 L 1560 820" stroke="url(#royalVioletAccent)" stroke-width="2" fill="none"/>
    </g>

    <!-- K: Lower Diagonal Arm (Sweeping to bottom-right with dynamic luxury flourish) -->
    <g id="k-lower-arm">
      <!-- Lower Arm Top Facet -->
      <path d="M 1270 1090 L 1580 1430 L 1630 1430 L 1320 1070 Z" fill="url(#silverHighlightFacet)"/>
      <!-- Lower Arm Bottom Facet (Shadowed) -->
      <path d="M 1320 1070 L 1630 1430 L 1700 1430 C 1720 1445 1740 1465 1720 1485 C 1680 1500 1630 1475 1590 1440 L 1340 1110 Z" fill="url(#silverShadowFacet)"/>
      <!-- Dynamic Swash Finial -->
      <path d="M 1580 1430 Q 1680 1480 1740 1450 Q 1700 1430 1630 1430 Z" fill="url(#silverChromeMain)" stroke="#FFFFFF" stroke-width="1"/>
      <!-- Center Chiseled Ridge -->
      <line x1="1295" y1="1080" x2="1620" y2="1435" stroke="#FFFFFF" stroke-width="3" opacity="0.95"/>
      <path d="M 1340 1110 L 1680 1470" stroke="url(#royalVioletAccent)" stroke-width="2" fill="none"/>
    </g>

  </g>

  <!-- ========================================== -->
  <!-- 4. FRONT ORBITAL RING (Passes in front of monogram) -->
  <!-- ========================================== -->
  <g id="front-orbital-ring" transform="rotate(-24 1200 1120)" filter="url(#castShadow)">
    <!-- Main Sweeping Front Luminous Ellipse Arc -->
    <!-- Outer Glow Stroke -->
    <path d="M 1920 1120 A 720 210 0 0 1 480 1120" fill="none" stroke="url(#electricBlueAccent)" stroke-width="7" opacity="0.85" filter="url(#luxuryGlow)"/>
    <!-- Core Platinum Metallic Arc -->
    <path d="M 1920 1120 A 720 210 0 0 1 480 1120" fill="none" stroke="url(#orbitalRingGrad)" stroke-width="4.5"/>
    <!-- Specular Highlight Line on Ring -->
    <path d="M 1750 1190 A 720 210 0 0 1 650 1190" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.9"/>

    <!-- Orbital Cyber Satellites / Diamond Nodes -->
    <!-- Node 1: Left Foreground (Electric Cyan Glint) -->
    <g transform="translate(680 1220)">
      <circle cx="0" cy="0" r="10" fill="url(#silverChromeMain)" stroke="#00F2FE" stroke-width="2" filter="url(#gemGlow)"/>
      <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
      <!-- 4-point flare -->
      <line x1="-18" y1="0" x2="18" y2="0" stroke="#00F2FE" stroke-width="1.5" opacity="0.8"/>
      <line x1="0" y1="-18" x2="0" y2="18" stroke="#00F2FE" stroke-width="1.5" opacity="0.8"/>
    </g>

    <!-- Node 2: Center-Right (Brilliant White Diamond) -->
    <g transform="translate(1480 1240)">
      <circle cx="0" cy="0" r="11" fill="url(#silverChromeMain)" stroke="#FFFFFF" stroke-width="2" filter="url(#gemGlow)"/>
      <circle cx="0" cy="0" r="5" fill="#00F2FE"/>
      <!-- 4-point Diamond Glint Flare -->
      <path d="M 0 -24 L 4 -4 L 24 0 L 4 4 L 0 24 L -4 4 L -24 0 L -4 -4 Z" fill="#FFFFFF" opacity="0.9"/>
    </g>

    <!-- Node 3: Far Right (Royal Violet Glint) -->
    <g transform="translate(1860 1140)">
      <circle cx="0" cy="0" r="8" fill="url(#silverChromeMain)" stroke="#C084FC" stroke-width="2" filter="url(#gemGlow)"/>
      <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 5. REFINED LUXURY TYPOGRAPHY               -->
  <!-- ========================================== -->
  <g id="brand-typography" filter="url(#castShadow)">
    
    <!-- Decorative Crest Divider Line with Center Diamond -->
    <g id="crest-divider">
      <line x1="680" y1="1620" x2="1140" y2="1620" stroke="url(#electricBlueAccent)" stroke-width="1.5" opacity="0.75"/>
      <circle cx="1140" cy="1620" r="3" fill="#00F2FE"/>
      
      <!-- Center Diamond Crest -->
      <g transform="translate(1200 1620)">
        <path d="M 0 -14 L 14 0 L 0 14 L -14 0 Z" fill="url(#silverChromeMain)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#gemGlow)"/>
        <circle cx="0" cy="0" r="3" fill="#00F2FE"/>
      </g>
      
      <circle cx="1260" cy="1620" r="3" fill="#C084FC"/>
      <line x1="1260" y1="1620" x2="1720" y2="1620" stroke="url(#royalVioletAccent)" stroke-width="1.5" opacity="0.75"/>
    </g>

    <!-- Primary Brand Name: NAGENDRA KUSHWAHA -->
    <text x="1200" y="1740" 
          font-family="'Cinzel', 'Outfit', 'Space Grotesk', 'Trajan Pro', 'Helvetica Neue', serif, sans-serif" 
          font-size="64" 
          font-weight="700" 
          letter-spacing="18" 
          text-anchor="middle" 
          fill="url(#silverChromeMain)" 
          stroke="#FFFFFF" 
          stroke-width="1"
          style="text-transform: uppercase;">
      NAGENDRA KUSHWAHA
    </text>

    <!-- Subtle Blue/Violet Dual Gradient Underline -->
    <line x1="840" y1="1780" x2="1200" y2="1780" stroke="url(#electricBlueAccent)" stroke-width="2" opacity="0.9"/>
    <line x1="1200" y1="1780" x2="1560" y2="1780" stroke="url(#royalVioletAccent)" stroke-width="2" opacity="0.9"/>

    <!-- Professional Luxury Subtitle -->
    <text x="1200" y="1840" 
          font-family="'JetBrains Mono', 'Space Grotesk', 'Courier New', monospace" 
          font-size="24" 
          font-weight="500" 
          letter-spacing="14" 
          text-anchor="middle" 
          fill="#CBD5E1" 
          opacity="0.9"
          style="text-transform: uppercase;">
      ✦ AI / ML SPECIALIST • DATA SCIENTIST ✦
    </text>

    <!-- Authentic Luxury Hallmark / Signature Seal (Small) -->
    <text x="1200" y="1900" 
          font-family="'Outfit', sans-serif" 
          font-size="14" 
          font-weight="400" 
          letter-spacing="8" 
          text-anchor="middle" 
          fill="#94A3B8" 
          opacity="0.6">
      OFFICIAL PERSONAL BRAND WATERMARK • 8K MASTER
    </text>

  </g>
</svg>
